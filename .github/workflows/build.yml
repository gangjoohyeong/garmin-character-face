name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # 비밀값 없이도 도는 기본 검사
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sprites.mc / sprites.js 가 생성기와 일치하는지
        run: |
          python tools/gen_sprites.py
          git diff --exit-code -- source-full/Sprites.mc source-store/Sprites.mc preview/sprites.js
      - name: 에셋 스크립트 (Pillow 없이 대체 파일 생성)
        run: python tools/fetch_assets.py && test -f source/Assets.mc
      - name: 미리보기 JS 문법 검사
        run: node --check preview/watchface.js
      - name: 리소스 교차 검사
        run: python tools/check_resources.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Monkey C 문법 검사
        working-directory: tools/check
        run: |
          npm ci
          npm run lint && node lint_mc.mjs ../../source-full && node lint_mc.mjs ../../source-store

  # Connect IQ SDK 로 실제 컴파일 (GARMIN_USERNAME / GARMIN_PASSWORD 비밀값 필요)
  build:
    runs-on: ubuntu-latest
    needs: check
    env:
      GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
      GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - name: 비밀값 확인
        id: secrets
        run: |
          if [ -z "$GARMIN_USERNAME" ] || [ -z "$GARMIN_PASSWORD" ]; then
            echo "::warning::GARMIN_USERNAME / GARMIN_PASSWORD 비밀값이 없어 컴파일을 건너뜁니다. README의 'CI 자동 빌드'를 참고하세요."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        if: steps.secrets.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - name: SDK / 기기 파일 받기
        if: steps.secrets.outputs.ok == 'true'
        run: |
          # 실패하면 마지막 줄들을 주석(annotation)으로 남김 (로그 없이도 원인 확인용)
          step() { if ! "$@" > step.log 2>&1; then cat step.log; tail -n 8 step.log | while IFS= read -r l; do echo "::error title=$1 $2::$l"; done; exit 1; fi; cat step.log; }
          curl -s https://raw.githubusercontent.com/lindell/connect-iq-sdk-manager-cli/master/install.sh | sh -s -- -b "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          step connect-iq-sdk-manager agreement accept
          step connect-iq-sdk-manager login
          step connect-iq-sdk-manager sdk set "^8"
          step connect-iq-sdk-manager device download --manifest=manifest.xml
          echo "$(connect-iq-sdk-manager sdk current-path --bin)" >> "$GITHUB_PATH"
          echo "::notice title=SDK::$(connect-iq-sdk-manager sdk current-path)"

      - uses: actions/setup-python@v5
        if: steps.secrets.outputs.ok == 'true'
        with:
          python-version: "3.12"

      - name: 외부 에셋 받기
        if: steps.secrets.outputs.ok == 'true'
        run: |
          pip install pillow
          python tools/fetch_assets.py

      - name: 컴파일
        if: steps.secrets.outputs.ok == 'true'
        run: |
          mkdir -p keys bin
          openssl genrsa -out keys/ci.pem 4096 2>/dev/null
          openssl pkcs8 -topk8 -inform PEM -outform DER -in keys/ci.pem -out keys/ci.der -nocrypt
          fail=0
          # 컴파일 오류/경고 줄을 주석(annotation)으로 남김
          build() {
            name="$1"; shift
            echo "::group::$name"
            if monkeyc "$@" > build.log 2>&1; then ok=1; else ok=0; fi
            cat build.log
            echo "::endgroup::"
            grep -E "^(ERROR|WARNING)" build.log | head -n 30 | while IFS= read -r l; do
              case "$l" in ERROR*) echo "::error title=$name::$l";; *) echo "::warning title=$name::$l";; esac
            done
            if [ $ok = 0 ]; then
              grep -qE "^ERROR" build.log || tail -n 8 build.log | while IFS= read -r l; do echo "::error title=$name::$l"; done
              fail=1
            else
              echo "::notice title=$name::성공"
            fi
          }
          for d in fr265s fr265; do
            build "전체판 $d" -f monkey.jungle -d "$d" -o "bin/PixelPals-$d.prg" -y keys/ci.der -l 0 -w
            build "스토어판 $d" -f store.jungle -d "$d" -o "bin/MochiPixel-$d.prg" -y keys/ci.der -l 0 -w
          done
          build "스토어 패키지" -e -r -f store.jungle -o bin/MochiPixel.iq -y keys/ci.der -l 0 -w
          exit $fail

      - name: .prg 업로드
        if: always() && steps.secrets.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PixelPals-builds
          path: |
            bin/*.prg
            bin/*.iq
